# Maps each doc page to the source code paths it covers.
# The staleness checker compares git log dates on these paths
# against the doc file's last commit date. If source changed
# more recently, the doc may be stale.
#
# Paths are relative to each repo root.
#
# Every page listed here must exist, and every page in docs.json
# should be listed here. Prune this file whenever pages are added,
# merged, or removed, or the check silently stops covering them.

repos:
  core: xfabric-sec/core
  agent-fabric: xfabric-sec/agent-fabric

pages:
  index.mdx:
    description: Product introduction and feature overview
    sources: []  # Only stale if features are added/removed

  deployment.mdx:
    description: Cloud deploy form and Terraform prepare modules
    sources:
      - repo: core
        paths:
          - deployments/production/
          - deployments/kubernetes/

  quickstart.mdx:
    description: First login, connecting a repository, and first code review
    sources:
      - repo: core
        paths:
          - frontend/src/app/(auth)/
          - frontend/src/app/(dashboard)/setup/
          - admin-backend/internal/handlers/auth.go

  analytics.mdx:
    description: Personal analytics dashboard (Foresight)
    sources:
      - repo: core
        paths:
          - frontend/src/app/(dashboard)/foresight/
          - frontend/src/components/_app/ask-cielara/  # summary cards reference Ask Cielara stats
          - frontend/src/hooks/app-dashboard/

  pr-detail.mdx:
    description: PR review detail three-column view
    sources:
      - repo: core
        paths:
          - frontend/src/app/(dashboard)/foresight/simulation/
      - repo: agent-fabric
        paths:
          - apps/foresight/

  world-model.mdx:
    description: Production World Model topology view, including canvas search and focus
    sources:
      - repo: core
        paths:
          - frontend/src/app/(dashboard)/production-world-model/
          - frontend/src/components/topology/
      - repo: agent-fabric
        paths:
          - worldmodel/

  ask-cielara.mdx:
    description: Ask Cielara AI assistant, including session management and the canvas
    sources:
      - repo: core
        paths:
          - frontend/src/app/(dashboard)/ask-cielara/
          - frontend/src/components/_app/ask-cielara/
          - backend/internal/ontology/

  impact.mdx:
    description: Org-wide Impact dashboard
    sources:
      - repo: core
        paths:
          - frontend/src/app/(dashboard)/impact/

  connections.mdx:
    description: Connections page and per-provider setup for every integration type
    sources:
      - repo: core
        paths:
          - frontend/src/app/(dashboard)/(system-integration)/
          - frontend/src/components/_app/connections/
          - frontend/src/components/_app/cloud-connections/
          - frontend/src/components/_app/source-code-connections/
          - frontend/src/components/_app/alert-connections/
          - frontend/src/components/_app/slack-configuration/
          - frontend/src/components/_app/jira-integration/
          - frontend/src/components/_app/confluence-integration/
          - frontend/src/components/_app/notion-integration/
          - frontend/src/components/_app/canva-integration/
          - frontend/src/components/_app/google-drive-integration/
          - frontend/src/components/_app/elasticsearch-connections/
          - frontend/src/components/_app/dynatrace-connections/
          - frontend/src/components/_app/hashicorp-vault-connections/
          - backend/internal/api/provider_account.go
          - backend/internal/api/slack_integration.go
          - backend/internal/api/jira_integration.go
          - backend/internal/api/confluence_integration.go
          - backend/internal/api/notion_integration.go
          - backend/internal/api/canva_integration.go
          - backend/internal/api/google_drive_integration.go

  users-and-access.mdx:
    description: User management, roles, permissions, and the invitation flow
    sources:
      - repo: core
        paths:
          - frontend/src/app/(dashboard)/users/
          - frontend/src/components/_app/users/
          - frontend/src/components/_app/roles/
          - frontend/src/components/_app/permissions/
          - admin-backend/internal/handlers/user.go

  models.mdx:
    description: LLM provider configuration wizard
    sources:
      - repo: core
        paths:
          - frontend/src/app/(dashboard)/admin/models/
          - frontend/src/app/(dashboard)/setup/llm-provider/
          - frontend/src/components/_app/setup/
          - backend/internal/api/llm_provider.go

  authentication.mdx:
    description: SSO and sign-in method configuration
    sources:
      - repo: core
        paths:
          - frontend/src/app/(dashboard)/admin/authentication/
          - frontend/src/components/_app/auth/
          - backend/internal/api/oidc/
