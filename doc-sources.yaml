# Maps each doc page to the source code paths it covers.
# The staleness checker compares git log dates on these paths
# against the doc file's last commit date. If source changed
# more recently, the doc may be stale.
#
# Paths are relative to each repo root.

repos:
  core: xfabric-sec/core
  agent-fabric: xfabric-sec/agent-fabric
  agent-memory: xfabric-sec/agent-memory

pages:
  index.mdx:
    description: Product introduction and feature overview
    sources: []  # Only stale if features are added/removed

  quickstart.mdx:
    description: Sign-up and first-run flow
    sources:
      - repo: core
        paths:
          - frontend/src/app/(auth)/
          - frontend/src/app/(dashboard)/setup/

  analytics.mdx:
    description: Personal analytics dashboard (Foresight)
    sources:
      - repo: core
        paths:
          - frontend/src/app/(dashboard)/foresight/
          - frontend/src/components/_app/ask-cielara/  # summary cards reference Ask Cielara stats
          - frontend/src/hooks/app-dashboard/

  pr-detail.mdx:
    description: PR review detail three-column view
    sources:
      - repo: core
        paths:
          - frontend/src/app/(dashboard)/foresight/simulation/
      - repo: agent-fabric
        paths:
          - apps/foresight/

  policies.mdx:
    description: Foresight policy management
    sources:
      - repo: core
        paths:
          - frontend/src/app/(dashboard)/policies/
          - frontend/src/components/_app/policies/
          - backend/internal/api/policy.go

  world-model.mdx:
    description: Production World Model topology view
    sources:
      - repo: core
        paths:
          - frontend/src/app/(dashboard)/production-world-model/
          - frontend/src/components/topology/
      - repo: agent-fabric
        paths:
          - worldmodel/

  document-mapping.mdx:
    description: WM Editing / wiki-to-workload mapping
    sources:
      - repo: core
        paths:
          - frontend/src/components/wm-editing/
      - repo: agent-fabric
        paths:
          - apps/wm_editing/

  ask-cielara.mdx:
    description: Ask Cielara AI assistant
    sources:
      - repo: core
        paths:
          - frontend/src/app/(dashboard)/ask-cielara/
          - frontend/src/components/_app/ask-cielara/
          - backend/internal/ontology/

  deep-inquiry.mdx:
    description: Deep Inquiry audit and verification
    sources:
      - repo: core
        paths:
          - frontend/src/app/(dashboard)/deep-inquiry/
          - frontend/src/components/deep-inquiry/
      - repo: agent-fabric
        paths:
          - apps/deep_inquiry/

  simulations.mdx:
    description: Scenario, Foresight, and Incident simulations
    sources:
      - repo: core
        paths:
          - frontend/src/app/(dashboard)/simulations/
          - frontend/src/components/_app/simulations/
          - frontend/src/components/_app/simulation-analysis/
          - backend/internal/simulation/
      - repo: agent-fabric
        paths:
          - apps/simulations/

  incidents.mdx:
    description: Incidents and root cause analysis
    sources:
      - repo: core
        paths:
          - frontend/src/app/(dashboard)/incidents/
          - frontend/src/components/_app/incidents/
          - frontend/src/app/(dashboard)/(rca)/
          - frontend/src/components/_app/rca/
          - backend/internal/api/rca/
      - repo: agent-fabric
        paths:
          - rca-agent/

  memory-explorer.mdx:
    description: Memory Explorer graph visualization
    sources:
      - repo: core
        paths:
          - frontend/src/app/(dashboard)/memory-explorer/
          - frontend/src/components/memory-explorer/
      - repo: agent-memory
        paths:
          - api/api.py
          - api/explorer.py
          - src/agent_memory/retrieval/

  impact.mdx:
    description: Org-wide Impact dashboard
